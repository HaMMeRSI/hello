server {
    listen 3080;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location = /sitemap.xml {
        return 301 /sitemap-index.xml;
    }

    location / {
        try_files $uri/index.html $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    error_page 404 /404.html;

    resolver 8.8.8.8 8.8.4.4 valid=30s ipv6=off;

    location ^~ /ingest/static/ {
        set $ph_assets us-assets.i.posthog.com;
        rewrite ^/ingest(/static/.*)$ $1 break;
        proxy_pass https://$ph_assets;
        proxy_set_header Host $ph_assets;
        proxy_ssl_server_name on;
    }

    location ^~ /ingest/ {
        set $ph_ingest us.i.posthog.com;
        rewrite ^/ingest(/.*)$ $1 break;
        proxy_pass https://$ph_ingest;
        proxy_set_header Host $ph_ingest;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 64m;
    }

    # Content-hashed Astro assets - cache forever (^~ prevents regex override)
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static assets
    location ~* \.(svg|png|ico|webp|jpg|jpeg|gif|avif|mp4|webm|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
