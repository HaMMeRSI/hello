<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232852"/><stop offset="1" stop-color="#0B0D1F"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="glow" x="-100%" y="-20%" width="300%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FF3B30" flood-opacity=".9"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <rect width="512" height="512" rx="0" fill="url(#gloss)"/>
  <rect x="66" y="206" width="380" height="100" rx="50" fill="#2C3160" filter="url(#shadow)"/>
  <rect x="84" y="224" width="84" height="64" rx="14" fill="#5B8CFF" opacity="0.6"/>
  <rect x="178" y="224" width="58" height="64" rx="14" fill="#35D0BA" opacity="0.6"/>
  <rect x="246" y="224" width="104" height="64" rx="14" fill="#B57BFF" opacity="1"/>
  <rect x="360" y="224" width="52" height="64" rx="14" fill="#FF7AB6" opacity="1"/>
  <g filter="url(#glow)"><line x1="300" y1="176" x2="300" y2="336" stroke="#FF3B30" stroke-width="6" stroke-linecap="round"/><circle cx="300" cy="176" r="11" fill="#FF3B30"/></g>
</svg>
