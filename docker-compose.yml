services:
  resume:
    build:
      context: .
      dockerfile: Dockerfile
    image: sagi-hammer
    container_name: sagi-hammer
    restart: unless-stopped
    ports:
      - '127.0.0.1:3081:3080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3080']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
