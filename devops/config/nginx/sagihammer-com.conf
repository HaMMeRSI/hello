server {
    server_name sagihammer.com www.sagihammer.com;

    # HTTPS + HTTP/2
    listen 443 ssl;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/sagihammer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sagihammer.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self';" always;

    # Canonical host redirect
    if ($host = www.sagihammer.com) {
        return 301 https://sagihammer.com$request_uri;
    }

    # Canonicalize index.html variants to clean URLs
    location = /index.html { return 301 https://sagihammer.com/$is_args$args; }
    location ~* ^/(.+)/index\.html$ { return 301 https://sagihammer.com/$1$is_args$args; }

    # Enforce no trailing slash on non-root URLs
    if ($request_uri ~ "^(.+)/+$") {
        return 301 https://sagihammer.com$1$is_args$args;
    }

    # Cache static assets aggressively — Astro fingerprints filenames.
    # NOTE: add_header in a location block does NOT inherit from the server block,
    # so security headers must be repeated here.
    location ~* \.(js|css|woff2|woff|ttf|eot|svg|png|jpg|jpeg|webp|avif|gif|ico|mp4|webm)$ {
        proxy_pass http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self';" always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name sagihammer.com www.sagihammer.com;
    return 301 https://sagihammer.com$request_uri;
}
